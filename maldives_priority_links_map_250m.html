const bufferMeters = 250.0;
const scoreField = "nearby_pop_250m";
const breaks = {moderate: 1134.059, high: 4105.984};

const map = L.map("map", {preferCanvas: true, zoomControl: false});
const cartoDark = L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
  {attribution: "&copy; OpenStreetMap contributors &copy; CARTO", subdomains: "abcd", maxZoom: 20}
).addTo(map);

const population = L.layerGroup(
  populationTiles.map(tile => L.imageOverlay(
    "data:image/png;base64," + tile.png,
    tile.bounds,
    {opacity: 0.75, interactive: false}
  ))
).addTo(map);

function colorFor(priority) {
  return {
    "Critical": "#bd0026",
    "High": "#fd8d3c",
    "Moderate": "#fed976",
    "No nearby population": "#807dba"
  }[priority] || "#807dba";
}
function lineStyle(feature) {
  const p = feature.properties.priority_class;
  return {
    color: colorFor(p),
    weight: p === "Critical" ? 5 : (p === "High" ? 4 : 2.5),
    opacity: p === "No nearby population" ? 0.6 : 0.95
  };
}
function popup(feature) {
  const p = feature.properties;
  const name = p.name || "(unnamed road link)";
  const pop = Number(p[scoreField]).toLocaleString(undefined, {maximumFractionDigits: 0});
  const length = Number(p.exposed_km || 0).toFixed(3);
  return `<strong>${name}</strong><br>
    Priority: <strong>${p.priority_class}</strong> (rank ${p.priority_rank})<br>
    Population within ${bufferMeters.toFixed(0)} m: <strong>${pop}</strong><br>
    Exposed length: ${length} km<br>
    Road class: ${p.highway || "not stated"}`;
}
function bindFeature(feature, layer) {
  layer.bindPopup(popup(feature));
  const pop = Number(feature.properties[scoreField]).toLocaleString(undefined, {maximumFractionDigits: 0});
  layer.bindTooltip(`${feature.properties.priority_class}: ${pop} people nearby`, {sticky: true});
}
const allLinks = L.geoJSON(links, {style: lineStyle, onEachFeature: bindFeature}).addTo(map);
const priorityLinks = L.geoJSON(links, {
  filter: f => ["Critical", "High"].includes(f.properties.priority_class),
  style: lineStyle,
  onEachFeature: bindFeature
});

function boundaryRings(geometry) {
  if (geometry.type === "Polygon") {
    return geometry.coordinates.map(ring => ring.map(([lon, lat]) => [lat, lon]));
  }
  return geometry.coordinates.flatMap(polygon =>
    polygon.map(ring => ring.map(([lon, lat]) => [lat, lon]))
  );

  fillColor: "#000000",

  fillRule: "evenodd",
  interactive: false
}).addTo(map);

allLinks.bringToFront();

const info = L.control({position: "topright"});
info.onAdd = function() {
  const div = L.DomUtil.create("div", "info-wrap");
  div.innerHTML = `<button class="info-button" type="button" aria-label="About the analysis">Info</button>
    <section class="info-panel" role="note">
      <h2>Note</h2>
      <p>The exposure of the Maldives road network to future coastal flooding was assessed by combining open road-network data with global coastal flood hazard layers. Road data were extracted from OpenStreetMap using a local Maldives <code>.osm.pbf</code> extract dated 26 May 2026. The analysis retained the main strategic road classes, including primary, secondary, tertiary, and their link classes. Residential and unclassified roads were also included because many roads in small island contexts such as the Maldives were not tagged as higher-order roads in OpenStreetMap, despite serving important local access functions.</p>
      <p>Flood exposure was assessed using the Deltares Global Flood Maps dataset. Two future coastal flood scenarios were processed for 2050: the 50-year and 100-year return period events. These layers provided modelled coastal flood depth, with inundation depth estimated from extreme coastal water levels and underlying terrain elevation. The selected product used MERIT-DEM at approximately 90 m resolution, meaning the analysis accounted for broad elevation differences but may not have captured fine-scale island features such as road embankments, seawalls, drainage structures, reclaimed land levels, or local coastal protection. For each flood scenario, the flood-depth raster was clipped to the Maldives boundary and reclassified using a minimum flood-depth threshold of 0.15 m, then overlaid to the road network. The main outputs were total selected road length, exposed road length, and the percentage of road length exposed under the 2050 50-year and 100-year coastal flood scenarios.</p>
      <p>The results were interpreted as a national screening assessment of potential coastal flood exposure. They were useful for identifying islands and road corridors that may require closer investigation, prioritization, or validation. However, they should not be interpreted as engineering-grade flood maps. More detailed local analysis would require higher-resolution elevation data, drainage information, road elevation or embankment height, coastal protection data, and locally calibrated flood observations.</p>
      <p>The population distribution layer (2030 estimate) was taken from WorldPop and was used to provide additional information to highlight the population living in proximity to the exposed roads. Other elements associated with the criticality of the exposed links are not captured.</p>
      <h3>Data sources and licensing</h3>
      <p>Road, points of interest, and administrative boundary data in this application are derived from OpenStreetMap and are licensed under the Open Database License (ODbL). Users are free to copy, distribute, transmit, and adapt this data, provided that &copy; OpenStreetMap contributors are credited and any derived database is shared under the same license. The OpenStreetMap-derived datasets used in this application are embedded directly in the HTML source of the page and may be obtained by saving or viewing the page source.</p>
      <p>Population data are sourced from WorldPop (2025) and are licensed under Creative Commons Attribution 4.0 (CC BY 4.0).</p>
      <h3>Disclaimer</h3>
      <p>This tool is provided for informational and analytical purposes only. While reasonable efforts have been made to ensure accuracy, the Asian Transport Observatory (ATO) makes no warranties regarding the completeness, accuracy, or suitability of the data or analyses for any specific purpose. The results should not be used as a substitute for official data, surveys, or engineering, planning, or investment decisions. Neither ATO nor its funders accepts responsibility for errors, omissions, or any use made of the information presented.</p>
    </section>`;
  L.DomEvent.disableClickPropagation(div);
  L.DomEvent.disableScrollPropagation(div);
  return div;
};
info.addTo(map);

const lineLegend = L.control({position: "bottomright"});
lineLegend.onAdd = function() {
  const div = L.DomUtil.create("div", "legend");
  div.innerHTML = `<strong>Priority links: nearby population</strong>
    <div class="legend-row"><span class="line-swatch" style="border-color:#bd0026"></span>Critical: &ge; ${Math.round(breaks.high).toLocaleString()}</div>
    <div class="legend-row"><span class="line-swatch" style="border-color:#fd8d3c"></span>High: ${Math.round(breaks.moderate).toLocaleString()} - ${Math.round(breaks.high - 0.001).toLocaleString()}</div>
    <div class="legend-row"><span class="line-swatch" style="border-color:#fed976"></span>Moderate: 1 - ${Math.round(breaks.moderate - 0.001).toLocaleString()}</div>
    <div class="legend-row"><span class="line-swatch" style="border-color:#807dba"></span>No population in buffer</div>`;
  return div;
};
lineLegend.addTo(map);

const populationLegend = L.control({position: "bottomright"});
populationLegend.onAdd = function() {
  const div = L.DomUtil.create("div", "legend");
  div.innerHTML = `<strong>2030 population raster</strong>
    <div class="pop-gradient"></div>
    <div class="pop-labels"><span>Lower</span><span>&ge; 775/cell</span></div>
